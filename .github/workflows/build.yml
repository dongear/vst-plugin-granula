name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: Granula-Windows
          - name: macOS
            os: macos-14
            artifact: Granula-macOS
          - name: Linux
            os: ubuntu-22.04
            artifact: Granula-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for t in Granula GranulaFX; do
            find "build/${t}_artefacts/Release" -maxdepth 2 \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) -print0 |
              while IFS= read -r -d '' b; do codesign --force --deep --sign - "$b"; done
          done

      - name: Validate with pluginval
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   PV=pluginval_Linux.zip;   BIN=./pluginval ;;
            macOS)   PV=pluginval_macOS.zip;   BIN=./pluginval.app/Contents/MacOS/pluginval ;;
            Windows) PV=pluginval_Windows.zip; BIN=./pluginval.exe ;;
          esac
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$PV"
          unzip -q -o pv.zip
          for P in "build/Granula_artefacts/Release/VST3/Granula.vst3" "build/GranulaFX_artefacts/Release/VST3/Granula FX.vst3"; do
            echo "== $P"
            if [ "$RUNNER_OS" == "Linux" ]; then
              xvfb-run -a $BIN --strictness-level 5 --skip-gui-tests --validate-in-process --timeout-ms 600000 "$P"
            else
              $BIN --strictness-level 5 --skip-gui-tests --validate-in-process --timeout-ms 600000 "$P"
            fi
          done

      - name: Package
        shell: bash
        run: |
          D="dist/${{ matrix.artifact }}"
          mkdir -p "$D"
          for t in Granula GranulaFX; do
            A="build/${t}_artefacts/Release"
            cp -R "$A"/VST3/*.vst3 "$D"/
            if [ "$RUNNER_OS" == "macOS" ]; then
              cp -R "$A"/AU/*.component "$D"/
              mkdir -p "$D/Standalone" && cp -R "$A"/Standalone/*.app "$D/Standalone"/
            elif [ "$RUNNER_OS" == "Windows" ]; then
              mkdir -p "$D/Standalone" && cp "$A"/Standalone/*.exe "$D/Standalone"/
            else
              mkdir -p "$D/Standalone" && find "$A/Standalone" -maxdepth 1 -type f -exec cp {} "$D/Standalone"/ \;
            fi
          done
          cp packaging/INSTALL.txt "$D"/
          if [ "$RUNNER_OS" == "macOS" ]; then cp packaging/install-mac.command "$D"/ && chmod +x "$D/install-mac.command"; fi
          cd dist && cmake -E tar cf ${{ matrix.artifact }}.zip --format=zip ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip

  release:
    name: Publish release
    needs: build
    # Every successful push to main publishes/updates the release for the
    # version in CMakeLists.txt; pushing a v* tag works as well.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "tag=v$(sed -nE 's/^project\(Granula VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Granula ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          files: dist/*.zip
          make_latest: true
          generate_release_notes: true
